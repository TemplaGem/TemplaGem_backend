name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Apps/backend/**'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Apps/backend/**'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'src/**'
      - 'package.json'
      - 'tsconfig*.json'

jobs:
  test-and-build:
    name: Test and Build (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Determine Backend Directory
        id: set-dir
        run: |
          if [ -d "Apps/backend" ]; then
            echo "BACKEND_DIR=Apps/backend" >> "$GITHUB_OUTPUT"
          else
            echo "BACKEND_DIR=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.set-dir.outputs.BACKEND_DIR }}
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck TypeScript
        working-directory: ${{ steps.set-dir.outputs.BACKEND_DIR }}
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ${{ steps.set-dir.outputs.BACKEND_DIR }}
        run: |
          if command -v pnpm &> /dev/null && [ -f "pnpm-lock.yaml" ]; then
            pnpm test
          else
            npm test --if-present
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.set-dir.outputs.BACKEND_DIR }}
          file: ${{ steps.set-dir.outputs.BACKEND_DIR }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/templagem_backend:latest

  deploy-ssh:
    name: Deploy via SSH (CD)
    needs: test-and-build
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            echo "==> Переход в директорию TemplaGem..."
            cd /home/server/projects/templagem

            echo "==> Скачивание свежего Docker-образа бэкенда..."
            docker compose pull backend

            echo "==> Перезапуск контейнера бэкенда без простоя Nginx и Mongo..."
            docker compose up -d --no-deps backend

            echo "==> Проверка статуса контейнеров..."
            docker ps --filter "name=templagem"

            echo "==> Валидация эндпоинта здоровья..."
            sleep 3
            curl -k -f --retry 5 --retry-delay 3 https://127.0.0.1:8443/api/health

            echo "==> Очистка висячих Docker-образов..."
            docker image prune -f

            echo "==> Деплой успешно завершен!"

