version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: templagem_api
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PORT: 4200
      MONGO_URL: mongodb://templaGem:templaGem@mongo:27017/templaGem?authSource=admin
      ACCESS_SECRET: ${ACCESS_SECRET:-default_access_secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-default_refresh_secret}
      ACCESS_EXPIRES: ${ACCESS_EXPIRES:-default_access_expires}
      REFRESH_EXPIRES: ${REFRESH_EXPIRES:-default_refresh_expires}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - templagem-network

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=templaGem
      - MONGO_INITDB_ROOT_PASSWORD=templaGem
      - MONGO_INITDB_DATABASE=templaGem
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - templagem-network

networks:
  templagem-network:
    driver: bridge

volumes:
  mongo-data:
